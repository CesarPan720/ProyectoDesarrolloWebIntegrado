<div class="dashboard-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="page-container">

      <div class="page-header">
        <div class="title-with-icon">
          <i class="fas fa-users title-icon"></i>
          <div>
            <h1>Usuarios</h1>
            <p>Gestiona el acceso y roles del personal y clientes</p>
          </div>
        </div>
        <button class="btn-primary" (click)="abrirModalNuevo()">
          <i class="fas fa-plus"></i> Nuevo Usuario
        </button>
      </div>

      <div class="table-container">
        <table class="custom-table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Nombre Completo</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let u of usuarios" [class.inactive-row]="!u.activo">
            <td>{{ u.id }}</td>
            <td class="font-bold">{{ u.nombreCompleto }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.telefono }}</td>
            <td>
              <span class="role-badge" [ngClass]="u.rol.toLowerCase()">{{ u.rol }}</span>
            </td>
            <td>
                <span class="status-badge" [class.status-active]="u.activo" [class.status-inactive]="!u.activo">
                  {{ u.activo ? 'Activo' : 'Inactivo' }}
                </span>
            </td>
            <td class="actions-cell">
              <button class="btn-action edit" title="Editar" (click)="abrirModalEdicion(u)">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-action"
                      [class.delete]="u.activo" [class.restore]="!u.activo"
                      [title]="u.activo ? 'Dar de baja' : 'Reactivar'"
                      (click)="cambiarEstado(u.id, u.activo)">
                <i class="fas" [class.fa-user-slash]="u.activo" [class.fa-user-check]="!u.activo"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Editar Usuario</h2>
      <button class="close-btn" (click)="cerrarModal()"><i class="fas fa-times"></i></button>
    </div>
    <form [formGroup]="usuarioForm" (ngSubmit)="guardarCambios()">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" formControlName="nombreCompleto">
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" formControlName="email">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" formControlName="telefono">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select formControlName="rol">
          <option value="CLIENTE">Cliente</option>
          <option value="VETERINARIO">Veterinario</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" [placeholder]="idUsuarioEditar ? 'Dejar en blanco para no cambiar' : 'Mínimo 6 caracteres'">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="usuarioForm.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
