<div class="dashboard-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="page-container">

      <div class="page-header">
        <div class="title-section">
          <h1>Mascotas</h1>
          <p>Gestiona los pacientes de la clínica</p>
        </div>
        <button class="btn-primary" *ngIf="puedeEditar()" (click)="abrirModal()">
          <i class="fas fa-plus"></i> Agregar Mascota
        </button>
      </div>

      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Buscar por nombre, dueño o raza...">
      </div>

      <div class="cards-grid">
        <div class="pet-card" *ngFor="let m of mascotas">

          <!-- Mantenemos card-top original pero añadimos position relative para posicionar bien la foto de fondo si existe -->
          <div class="card-top">
            <!-- Si la mascota tiene foto, se expande como fondo de la zona superior de forma controlada sin deformar -->
            <img *ngIf="m.foto" [src]="'http://localhost:8080/api/mascotas/uploads/' + m.foto" alt="Foto Mascota"
              style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;">

            <!-- Capa oscura traslúcida para que los textos en blanco resalten sobre la imagen -->
            <div *ngIf="m.foto"
              style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)); z-index: 2;">
            </div>

            <!-- Tus card-actions originales, con un estilo en línea sutil para darles contraste oscuro sobre fotos claras -->
            <div class="card-actions" *ngIf="puedeEditar()"
              style="position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 8px;">
              <button class="icon-btn" (click)="abrirModal(m)" style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-edit" style="color: white;"></i>
              </button>
              <button class="icon-btn" (click)="eliminarMascota(m.id)"
                style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-trash" style="color: #fc8181;"></i>
              </button>
            </div>

            <!-- Tu pet-avatar clásico oculto si hay foto para evitar que tape la imagen o se dupliquen -->
            <div *ngIf="!m.foto" class="pet-avatar"
              style="overflow: hidden; display: flex; justify-content: center; align-items: center; z-index: 3;">
              <i class="fas fa-paw"></i>
            </div>

            <!-- Mantenemos tus etiquetas intactas subiendo su z-index si hay imagen -->
            <h3 style="z-index: 3; position: relative;">{{ m.nombre }}</h3>
            <span class="badge" style="z-index: 3; position: relative; width: fit-content;">{{ m.especie }} - {{ m.raza
              }}</span>
          </div>

          <div class="card-bottom">
            <p><i class="far fa-user"></i> Dueño: <strong>{{ m.cliente?.usuario?.nombreCompleto || 'Desconocido'
                }}</strong></p>
            <div class="info-row">
              <p><i class="fas fa-weight"></i> Peso: {{ m.peso }} kg</p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ idMascotaEditar ? 'Editar Mascota' : 'Nueva Mascota' }}</h2>
      <button class="close-btn" (click)="cerrarModal()"><i class="fas fa-times"></i></button>
    </div>

    <form [formGroup]="mascotaForm" (ngSubmit)="guardarMascota()">
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre de la Mascota</label>
          <input type="text" formControlName="nombre">
        </div>
        <div class="form-group">
          <label>Especie</label>
          <select formControlName="especie">
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
            <option value="Conejo">Conejo</option>
            <option value="Exótico">Exótico</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raza</label>
          <input type="text" formControlName="raza">
        </div>
        <div class="form-group">
          <label>Peso (kg)</label>
          <input type="number" formControlName="peso" step="0.1">
        </div>

        <div class="form-group full-width" *ngIf="userRole === 'ADMIN'">
          <label>Seleccionar Dueño (Cliente)</label>
          <select formControlName="clienteId">
            <option value="" disabled selected>-- Seleccione un cliente de la lista --</option>
            <option *ngFor="let c of clientes" [value]="c.id">
              {{ c.nombre }} ({{ c.email }})
            </option>
          </select>
        </div>

        <!-- Input de archivo original intacto -->
        <div class="form-group full-width">
          <label style="font-weight: bold; color: #4a5568;">Foto de la Mascota</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)"
            style="border: 1px dashed #cbd5e0; padding: 8px; border-radius: 6px; background: #f7fafc; width: 100%;">
          <small style="color: #718096; display: block; margin-top: 4px;">Formatos admitidos: JPG, PNG. Máximo
            5MB.</small>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="mascotaForm.invalid">
          {{ idMascotaEditar ? 'Guardar Cambios' : 'Agregar Mascota' }}
        </button>
      </div>
    </form>
  </div>
</div>
